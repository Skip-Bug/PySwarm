services:
  backend:
    build: .
    container_name: pyswarm_backend
    ports:
      - "8000:8000"
    volumes:
      - ./tmp:/app/tmp
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      - MAX_USERS_DEFAULT=50
      - TEST_DURATION_DEFAULT=60

  locust_master:
    build: .
    container_name: pyswarm_master
    ports:
      - "8089:8089"
    volumes:
      - ./tmp:/app/tmp
    command: locust -f locust_file.py --master --web-host 0.0.0.0 --web-port 8089

  locust_worker:
    build: .
    volumes:
      - ./tmp:/app/tmp
    command: locust -f locust_file.py --worker --master-host locust_master
    depends_on:
      - locust_master
    restart: on-failure
